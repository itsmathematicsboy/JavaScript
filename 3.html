    <script>

        const heading = document.querySelector("h1");

        // console.log(heading);

        document.getElementById('isText').innerText = "PPKD Jakarta Pusat";
        heading3.innerText = "DUARRR";

        const totalBelanja = 100000;

        if(isMember || totalBelanja >= 20000){
            diskon = .1;

                console.log("bukan biru")
        }

        for(let i = 0; i < 10; i++){
            console.log(`Angka ke-${i}`);
        }


        // Array
        let nama = ["Budi", "Laras", "Andi"];
        const keranjang = ["Buah", "Sayuran", "Ikan"];

        console.log(nama[1]);
        console.log(nama[2]);

        }
